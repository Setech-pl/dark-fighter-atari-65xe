FEATURES {
    STARTADDRESS: default = $2000;
}

MEMORY {
    ZP:            start = $0080, size = $0080, type = rw, define = yes;
    MAIN:          start = $2000, size = $2000, type = rw, file = %O, fill = yes, define = yes;
    BOOTTAIL:      start = $4000, size = $1200, type = ro, file = %O, fill = yes, define = yes;
    BROADSIDE_RAM: start = $5E10, size = $1200, type = rw, file = "", define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BROADSIDE: load = BOOTTAIL, run = BROADSIDE_RAM, type = ro, define = yes;
}
