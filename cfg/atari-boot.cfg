FEATURES {
    STARTADDRESS: default = $2000;
}

MEMORY {
    ZP:            start = $0080, size = $0080, type = rw, define = yes;
    MAIN:          start = $2000, size = $2000, type = rw, file = %O, fill = yes, define = yes;
    BOOTTAIL:      start = $4000, size = $1A00, type = ro, file = %O, fill = yes, define = yes;
    STARTAIL:      start = $5A00, size = $1000, type = ro, file = %O, fill = yes, define = yes;
    PROJECTILE_RAM:start = $5400, size = $012A, type = rw, file = "", define = yes;
    STARFIELD_RAM: start = $552A, size = $08E6, type = rw, file = "", define = yes;
    BROADSIDE_RAM: start = $5E10, size = $1A00, type = rw, file = "", define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    PROJECTILES: load = PROJECTILE_RAM, type = bss, define = yes;
    STARFIELD: load = STARTAIL, run = STARFIELD_RAM, type = ro, define = yes;
    BROADSIDE: load = BOOTTAIL, run = BROADSIDE_RAM, type = ro, define = yes;
}
